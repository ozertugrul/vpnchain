name: Release & Multiplatform Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Tests & Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run unit & smoke tests
        run: flutter test

  build-windows:
    name: Build Windows Release
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Copy native binaries to release build
        shell: pwsh
        run: |
          Copy-Item windows\bin\speederv2.exe build\windows\x64\runner\Release\speederv2.exe

      - name: Build Windows Setup Installer (Inno Setup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\iscc.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" windows/installer.iss
          } elseif (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc windows/installer.iss
          } else {
            choco install innosetup -y
            & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" windows/installer.iss
          }

      - name: Package Windows Portable Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\vpnchain-windows-portable.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vpnchain-windows-binaries
          path: |
            dist/vpnchain-windows-installer.exe
            dist/vpnchain-windows-portable.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vpnchain-windows-installer.exe
            dist/vpnchain-windows-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS DMG
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Re-sign App Bundle
        run: codesign --force --deep --sign - build/macos/Build/Products/Release/vpnchain.app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG Installer
        run: |
          mkdir -p dist
          create-dmg \
            --volname "VPNChain" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 120 \
            --icon "vpnchain.app" 150 190 \
            --app-drop-link 450 190 \
            --hide-extension "vpnchain.app" \
            --no-internet-enable \
            dist/vpnchain-macos.dmg \
            build/macos/Build/Products/Release/vpnchain.app
          codesign --force --sign - dist/vpnchain-macos.dmg

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vpnchain-macos.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
